# 说明：以下为 Linux 路径示例（/var/www/...）；Windows 部署时换成实际目录，如 C:/wwwroot/locallink/...
server {
    listen 80;
    server_name your-domain.com;
    
    # 字符集配置
    charset utf-8;
    
    # 前端静态文件目录
    root /var/www/locallink/locallink-web/dist;
    index index.html index.htm;

    # 日志配置
    access_log /var/log/nginx/locallink_access.log;
    error_log /var/log/nginx/locallink_error.log;

    # Vue 路由支持（HTML5 History 模式）
    location / {
        try_files $uri $uri/ /index.html;
        
        # 静态资源缓存配置
        location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 后端 API 反向代理
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置（API 请求不需要太长）
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # 缓冲区配置
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # WebSocket 直接代理 - 优化版本（确保稳定性）
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        
        # ⭐ 关键：WebSocket 协议升级
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        #  关键：传递主机信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 关键：禁用缓冲和缓存
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
        
        # ⭐ 关键：超时配置（必须足够长以支持长连接）
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;    # 1小时，适应长连接
        proxy_read_timeout 3600s;    # 1小时，适应长连接
        
        # ⭐ 关键：确保连接保持活跃
        proxy_set_header Connection "keep-alive";
        
        # 日志记录（调试用，生产环境可注释掉）
        access_log /var/log/nginx/locallink_ws_access.log;
        error_log /var/log/nginx/locallink_ws_error.log info;
    }
    
    # 静态文件上传目录代理
    location /uploads {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # 文件下载缓存
        expires 1d;
        add_header Cache-Control "public";
    }

    # 错误页配置
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root html;
    }
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
