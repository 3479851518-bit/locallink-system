# ========================================
# Spring 配置
# ========================================
spring:
  # 默认 dev：内置 H2，无需 MySQL。使用 MySQL 请设置 SPRING_PROFILES_ACTIVE=mysql
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:./application-local.yml

  # Web资源配置
  web:
    resources:
      static-locations: classpath:/static/,file:./static/
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  
  # RabbitMQ配置（已禁用，项目使用 WebSocket 和 HTTP 轮询）
  # rabbitmq:
  #   host: localhost
  #   port: 5672
  #   username: guest
  #   password: guest
  #   virtual-host: /

# ========================================
# Server 配置
# ========================================
server:
  port: 8080
  # Tomcat WebSocket 超时配置
  tomcat:
    connection-timeout: 3600000  # 1小时（毫秒）

# ========================================
# MyBatis-Plus 配置
# ========================================
mybatis-plus:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.locallink.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========================================
# 日志配置
# ========================================
logging:
  level:
    com.locallink: DEBUG
    com.locallink.service: DEBUG
    org.springframework.web: DEBUG
  charset:
    console: UTF-8
    file: UTF-8

# ========================================
# SpringDoc OpenAPI 配置
# ========================================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha

# ========================================
# WebSocket 配置
# ========================================
websocket:
  # 是否启用 WebSocket
  enabled: true
  # 心跳间隔（毫秒）
  heartbeat-interval: 30000
  # 消息撤回时间限制（秒）
  recall-time-limit: 120

# ========================================
# 文件上传路径配置
# ========================================
file:
  upload:
    path: uploads
    avatar:
      max-size: 5242880  # 5MB
    group-avatar:
      max-size: 5242880  # 5MB