# ========================================
# 测试环境配置 - 使用H2内存数据库
# ========================================
server:
  port: 8081

# 禁用WebSocket(测试环境不需要)
websocket:
  enabled: false

# ========================================
# 数据源配置 - 使用真实MySQL数据库
# ========================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/locallink_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: PassWord1234
  
  # 数据库初始化(使用schema.sql创建表结构)
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  
 
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  
  # RabbitMQ配置 - 测试环境禁用
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

# ========================================
# MyBatis-Plus 配置
# ========================================
mybatis-plus:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.locallink.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========================================
# 日志配置
# ========================================
logging:
  level:
    com.locallink: DEBUG
    org.springframework.web: WARN
    org.mybatis: DEBUG
